name: Scrape Trafikverket

# Schemaläggning sker numera via Supabase pg_cron → Edge Function `scrape`
# (se db/migrations/0004_pg_cron_scrape.sql och supabase/functions/scrape/).
# Detta workflow finns kvar som manuell nödknapp och triggar samma Edge
# Function direkt, så ingen separat Node-scraper behöver hållas i sync.
on:
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger Supabase Edge scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SCRAPE_SHARED_SECRET: ${{ secrets.SCRAPE_SHARED_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST "${SUPABASE_URL%/}/functions/v1/scrape" \
            -H "Authorization: Bearer ${SCRAPE_SHARED_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{}'
